<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Generate Brain Image</title>
<style>
body { background: #1a1145; display: flex; flex-direction: column; align-items: center; padding: 20px; font-family: Arial; color: white; }
canvas { border: 1px solid #333; margin: 10px; }
button { padding: 12px 24px; font-size: 16px; background: #8b5cf6; color: white; border: none; border-radius: 8px; cursor: pointer; margin: 10px; }
button:hover { background: #7c3aed; }
a { color: #67e8f9; }
</style>
</head>
<body>
<h2>Brain AI Image Generator</h2>
<p>Click the button to save as JPG (the animation runs for 2 seconds to capture a good frame)</p>
<canvas id="c" width="600" height="500"></canvas>
<br>
<button onclick="saveImage()">Save as JPG</button>
<p id="status"></p>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = 600, H = 500;

const brainCenterX = W / 2, brainCenterY = H / 2 - 20;
const brainRadiusX = 160, brainRadiusY = 130;

function isInsideBrain(x, y) {
    const dx = x - brainCenterX, dy = y - brainCenterY;
    const leftHemi = Math.pow((dx + 10) / brainRadiusX, 2) + Math.pow(dy / brainRadiusY, 2);
    const rightHemi = Math.pow((dx - 10) / brainRadiusX, 2) + Math.pow(dy / brainRadiusY, 2);
    const stemCheck = Math.abs(dx) < 30 && dy > brainRadiusY * 0.6 && dy < brainRadiusY * 1.2;
    return leftHemi < 1 || rightHemi < 1 || stemCheck;
}

const neuronNodes = [], neuronEdges = [], rainDrops = [], glowParticles = [];

// Seeded random for reproducibility
let seed = 42;
function seededRandom() { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }

for (let i = 0; i < 200; i++) {
    let x, y, attempts = 0;
    do {
        x = brainCenterX + (seededRandom() - 0.5) * brainRadiusX * 2.2;
        y = brainCenterY + (seededRandom() - 0.5) * brainRadiusY * 2.2;
        attempts++;
    } while (!isInsideBrain(x, y) && attempts < 100);
    if (attempts < 100) {
        neuronNodes.push({
            x, y,
            radius: seededRandom() * 2.5 + 0.8,
            pulse: seededRandom() * Math.PI * 2,
            pulseSpeed: 0.02 + seededRandom() * 0.03,
            colorType: seededRandom() > 0.5 ? 0 : (seededRandom() > 0.5 ? 1 : 2),
            brightness: 0.3 + seededRandom() * 0.7
        });
    }
}

for (let i = 0; i < neuronNodes.length; i++) {
    for (let j = i + 1; j < neuronNodes.length; j++) {
        const dx = neuronNodes[i].x - neuronNodes[j].x;
        const dy = neuronNodes[i].y - neuronNodes[j].y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < 55 && seededRandom() > 0.45) {
            neuronEdges.push({ a: i, b: j, signal: seededRandom(), signalSpeed: 0.004 + seededRandom() * 0.012 });
        }
    }
}

for (let i = 0; i < 150; i++) {
    rainDrops.push({
        x: seededRandom() * W,
        y: seededRandom() * H,
        speed: 0.4 + seededRandom() * 2.5,
        length: 8 + seededRandom() * 25,
        opacity: 0.08 + seededRandom() * 0.35,
        colorIdx: Math.floor(seededRandom() * 3)
    });
}

const rainColors = [[139,92,246],[6,182,212],[167,139,250]];

for (let i = 0; i < 50; i++) {
    glowParticles.push({
        x: seededRandom() * W, y: seededRandom() * H,
        vx: (seededRandom() - 0.5) * 0.3, vy: (seededRandom() - 0.5) * 0.3,
        radius: 1 + seededRandom() * 3.5,
        opacity: 0.15 + seededRandom() * 0.45,
        colorIdx: Math.floor(seededRandom() * 5),
        pulse: seededRandom() * Math.PI * 2
    });
}

const glowColors = [[139,92,246],[6,182,212],[236,72,153],[167,139,250],[103,232,249]];

let time = 0;

function draw() {
    // Background
    const grad = ctx.createRadialGradient(W/2, H/2, 50, W/2, H/2, W*0.7);
    grad.addColorStop(0, '#1a1145');
    grad.addColorStop(0.4, '#0f0a2e');
    grad.addColorStop(0.7, '#0a0620');
    grad.addColorStop(1, '#050312');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    // Stars
    seed = 1000;
    for (let i = 0; i < 100; i++) {
        const sx = seededRandom() * W, sy = seededRandom() * H;
        const twinkle = 0.3 + 0.7 * Math.sin(time * 0.5 + i);
        ctx.fillStyle = `rgba(255,255,255,${0.15 * twinkle})`;
        ctx.fillRect(sx, sy, 1, 1);
    }

    // Rain
    rainDrops.forEach(d => {
        d.y += d.speed;
        if (d.y > H + d.length) { d.y = -d.length; d.x = Math.random() * W; }
        const c = rainColors[d.colorIdx];
        const lg = ctx.createLinearGradient(d.x, d.y - d.length, d.x, d.y);
        lg.addColorStop(0, `rgba(${c[0]},${c[1]},${c[2]},0)`);
        lg.addColorStop(1, `rgba(${c[0]},${c[1]},${c[2]},${d.opacity})`);
        ctx.beginPath();
        ctx.moveTo(d.x, d.y - d.length);
        ctx.lineTo(d.x, d.y);
        ctx.strokeStyle = lg;
        ctx.lineWidth = 1;
        ctx.stroke();
    });

    // Brain glow
    const bg = ctx.createRadialGradient(brainCenterX, brainCenterY, 60, brainCenterX, brainCenterY, 220);
    bg.addColorStop(0, 'rgba(139,92,246,0.18)');
    bg.addColorStop(0.3, 'rgba(6,182,212,0.1)');
    bg.addColorStop(0.6, 'rgba(236,72,153,0.05)');
    bg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    const pulse2 = 0.8 + 0.2 * Math.sin(time * 0.8);
    const ig = ctx.createRadialGradient(brainCenterX, brainCenterY, 20, brainCenterX, brainCenterY, 150);
    ig.addColorStop(0, `rgba(139,92,246,${0.14 * pulse2})`);
    ig.addColorStop(0.5, `rgba(6,182,212,${0.07 * pulse2})`);
    ig.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = ig;
    ctx.fillRect(0, 0, W, H);

    // Brain outline
    ctx.beginPath();
    ctx.ellipse(brainCenterX - 10, brainCenterY, brainRadiusX * 0.95, brainRadiusY * 0.95, 0, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(139,92,246,${0.12 + 0.05 * Math.sin(time)})`;
    ctx.lineWidth = 1;
    ctx.stroke();

    // Brain folds
    seed = 500;
    for (let i = 0; i < 10; i++) {
        ctx.beginPath();
        const startAngle = (i / 10) * Math.PI * 2;
        const cx = brainCenterX + Math.cos(startAngle) * 30;
        const cy = brainCenterY + Math.sin(startAngle) * 20;
        let started = false;
        for (let t = 0; t < 1; t += 0.015) {
            const angle = startAngle + t * 1.5;
            const r = 40 + t * 85 + Math.sin(t * 10 + time * 0.5) * 8;
            const px = cx + Math.cos(angle) * r * 0.8;
            const py = cy + Math.sin(angle) * r * 0.7;
            if (isInsideBrain(px, py)) {
                if (!started) { ctx.moveTo(px, py); started = true; }
                else ctx.lineTo(px, py);
            }
        }
        ctx.strokeStyle = `rgba(139,92,246,${0.05 + 0.02 * Math.sin(time + i)})`;
        ctx.lineWidth = 0.5;
        ctx.stroke();
    }

    // Neural edges with signals
    neuronEdges.forEach(e => {
        const a = neuronNodes[e.a], b = neuronNodes[e.b];
        e.signal = (e.signal + e.signalSpeed) % 1;
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        ctx.strokeStyle = `rgba(139,92,246,${0.07 + 0.04 * Math.sin(time + e.a)})`;
        ctx.lineWidth = 0.5;
        ctx.stroke();

        const sx = a.x + (b.x - a.x) * e.signal;
        const sy = a.y + (b.y - a.y) * e.signal;
        const sg = ctx.createRadialGradient(sx, sy, 0, sx, sy, 4);
        sg.addColorStop(0, 'rgba(103,232,249,0.7)');
        sg.addColorStop(1, 'rgba(103,232,249,0)');
        ctx.fillStyle = sg;
        ctx.fillRect(sx - 4, sy - 4, 8, 8);
    });

    // Neuron nodes
    neuronNodes.forEach(n => {
        n.pulse += n.pulseSpeed;
        const p = 0.5 + 0.5 * Math.sin(n.pulse);
        const r = n.radius * (0.8 + 0.4 * p);
        const alpha = n.brightness * (0.4 + 0.6 * p);

        const ng = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, r * 3.5);
        const colors = [[103,232,249],[236,72,153],[255,255,255]];
        const c = colors[n.colorType];
        ng.addColorStop(0, `rgba(${c[0]},${c[1]},${c[2]},${alpha})`);
        ng.addColorStop(0.5, `rgba(${c[0]},${c[1]},${c[2]},${alpha * 0.25})`);
        ng.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = ng;
        ctx.beginPath();
        ctx.arc(n.x, n.y, r * 3.5, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = `rgba(255,255,255,${alpha})`;
        ctx.beginPath();
        ctx.arc(n.x, n.y, r * 0.5, 0, Math.PI * 2);
        ctx.fill();
    });

    // Glow particles
    glowParticles.forEach(p => {
        p.x += p.vx; p.y += p.vy; p.pulse += 0.02;
        if (p.x < 0) p.x = W; if (p.x > W) p.x = 0;
        if (p.y < 0) p.y = H; if (p.y > H) p.y = 0;
        const alpha = p.opacity * (0.5 + 0.5 * Math.sin(p.pulse));
        const c = glowColors[p.colorIdx];
        const gg = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.radius * 4);
        gg.addColorStop(0, `rgba(${c[0]},${c[1]},${c[2]},${alpha})`);
        gg.addColorStop(1, `rgba(${c[0]},${c[1]},${c[2]},0)`);
        ctx.fillStyle = gg;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius * 4, 0, Math.PI * 2);
        ctx.fill();
    });

    // AI Text
    const tp = 0.7 + 0.3 * Math.sin(time * 1.2);
    ctx.save();
    ctx.font = 'bold 56px Arial, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.shadowColor = `rgba(139,92,246,${0.8 * tp})`;
    ctx.shadowBlur = 30;
    ctx.fillStyle = `rgba(255,255,255,${0.9 * tp})`;
    ctx.fillText('AI', brainCenterX, brainCenterY + 5);
    ctx.shadowColor = `rgba(6,182,212,${0.5 * tp})`;
    ctx.shadowBlur = 50;
    ctx.fillText('AI', brainCenterX, brainCenterY + 5);
    ctx.shadowBlur = 0;
    ctx.restore();

    time += 0.016;
}

function animate() {
    draw();
    requestAnimationFrame(animate);
}
animate();

function saveImage() {
    const link = document.createElement('a');
    link.download = 'ai-brain.jpg';
    link.href = canvas.toDataURL('image/jpeg', 0.95);
    link.click();
    document.getElementById('status').textContent = 'Image saved! Move the downloaded file to your img/ folder.';
}
</script>
</body>
</html>
