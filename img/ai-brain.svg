<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 600" width="500" height="600">
  <defs>
    <!-- Background gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1a0a3e"/>
      <stop offset="50%" stop-color="#0d0628"/>
      <stop offset="100%" stop-color="#050210"/>
    </radialGradient>

    <!-- Brain gradient -->
    <linearGradient id="brainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="30%" stop-color="#a855f7"/>
      <stop offset="60%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>

    <!-- Glow filters -->
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="strongGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="15" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="nodeGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="auraGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="25"/>
    </filter>
    <filter id="particleGlow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3"/>
    </filter>
    <filter id="textGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Sparkle gradient -->
    <radialGradient id="sparkle">
      <stop offset="0%" stop-color="#e9d5ff"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Dark background -->
  <rect width="500" height="600" fill="url(#bgGlow)"/>

  <!-- Ambient glow behind brain -->
  <ellipse cx="250" cy="210" rx="180" ry="160" fill="#7c3aed" opacity="0.08" filter="url(#auraGlow)"/>
  <ellipse cx="250" cy="210" rx="120" ry="110" fill="#a855f7" opacity="0.12" filter="url(#auraGlow)"/>
  <ellipse cx="230" cy="190" rx="80" ry="70" fill="#c084fc" opacity="0.08" filter="url(#auraGlow)"/>
  <ellipse cx="270" cy="200" rx="70" ry="60" fill="#06b6d4" opacity="0.05" filter="url(#auraGlow)"/>

  <!-- ===== BRAIN OUTLINE — LEFT HEMISPHERE ===== -->
  <g filter="url(#softGlow)">
    <path d="M245,100 C210,95 175,105 155,130 C135,155 125,185 130,215 C125,225 118,240 120,260 C115,275 118,295 130,310 C135,330 150,345 170,352 C185,365 205,370 225,368 C235,370 245,365 250,360"
          fill="none" stroke="url(#brainGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>

    <!-- Left brain folds -->
    <path d="M165,145 C180,140 200,145 215,155 C225,162 235,168 245,165" fill="none" stroke="#c084fc" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
    <path d="M148,175 C165,168 190,172 210,185 C225,195 240,195 250,190" fill="none" stroke="#a78bfa" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <path d="M138,210 C155,200 180,205 200,218 C220,228 240,225 250,220" fill="none" stroke="#c084fc" stroke-width="1.5" stroke-linecap="round" opacity="0.65"/>
    <path d="M135,245 C155,235 175,240 195,252 C215,262 235,258 250,250" fill="none" stroke="#a78bfa" stroke-width="1.5" stroke-linecap="round" opacity="0.55"/>
    <path d="M140,278 C158,268 178,272 198,285 C218,295 238,290 250,282" fill="none" stroke="#c084fc" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <path d="M155,310 C172,300 192,305 210,315 C228,322 242,318 250,312" fill="none" stroke="#a78bfa" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
    <path d="M175,338 C192,330 212,333 230,340 C240,344 248,342 250,338" fill="none" stroke="#c084fc" stroke-width="1.5" stroke-linecap="round" opacity="0.55"/>
  </g>

  <!-- ===== BRAIN OUTLINE — RIGHT HEMISPHERE ===== -->
  <g filter="url(#softGlow)">
    <path d="M255,100 C290,95 325,105 345,130 C365,155 375,185 370,215 C375,225 382,240 380,260 C385,275 382,295 370,310 C365,330 350,345 330,352 C315,365 295,370 275,368 C265,370 255,365 250,360"
          fill="none" stroke="url(#brainGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>

    <!-- Right brain folds -->
    <path d="M335,145 C320,140 300,145 285,155 C275,162 265,168 255,165" fill="none" stroke="#c084fc" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
    <path d="M352,175 C335,168 310,172 290,185 C275,195 260,195 250,190" fill="none" stroke="#a78bfa" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <path d="M362,210 C345,200 320,205 300,218 C280,228 260,225 250,220" fill="none" stroke="#c084fc" stroke-width="1.5" stroke-linecap="round" opacity="0.65"/>
    <path d="M365,245 C345,235 325,240 305,252 C285,262 265,258 250,250" fill="none" stroke="#a78bfa" stroke-width="1.5" stroke-linecap="round" opacity="0.55"/>
    <path d="M360,278 C342,268 322,272 302,285 C282,295 262,290 250,282" fill="none" stroke="#c084fc" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <path d="M345,310 C328,300 308,305 290,315 C272,322 258,318 250,312" fill="none" stroke="#a78bfa" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
    <path d="M325,338 C308,330 288,333 270,340 C260,344 252,342 250,338" fill="none" stroke="#c084fc" stroke-width="1.5" stroke-linecap="round" opacity="0.55"/>
  </g>

  <!-- Central fissure -->
  <line x1="250" y1="98" x2="250" y2="365" stroke="#8b5cf6" stroke-width="1.5" opacity="0.4" filter="url(#softGlow)"/>

  <!-- ===== NEURAL NETWORK CONNECTIONS ===== -->
  <g stroke="#a78bfa" stroke-width="0.8" opacity="0.35" filter="url(#softGlow)">
    <!-- Cross-hemisphere connections -->
    <line x1="185" y1="155" x2="315" y2="155"/>
    <line x1="170" y1="200" x2="330" y2="200"/>
    <line x1="165" y1="245" x2="335" y2="245"/>
    <line x1="175" y1="290" x2="325" y2="290"/>
    <line x1="195" y1="325" x2="305" y2="325"/>
    <!-- Diagonal connections -->
    <line x1="180" y1="150" x2="300" y2="240"/>
    <line x1="200" y1="240" x2="320" y2="150"/>
    <line x1="170" y1="200" x2="310" y2="310"/>
    <line x1="190" y1="310" x2="330" y2="200"/>
    <line x1="185" y1="270" x2="315" y2="180"/>
    <line x1="185" y1="180" x2="315" y2="270"/>
  </g>

  <!-- ===== NEURAL NODES ===== -->
  <g filter="url(#nodeGlow)">
    <!-- Left hemisphere nodes -->
    <circle cx="175" cy="145" r="4" fill="#c084fc" opacity="0.9"/>
    <circle cx="155" cy="185" r="3.5" fill="#a78bfa" opacity="0.85"/>
    <circle cx="145" cy="225" r="4" fill="#c084fc" opacity="0.9"/>
    <circle cx="148" cy="265" r="3.5" fill="#a78bfa" opacity="0.85"/>
    <circle cx="158" cy="300" r="4" fill="#c084fc" opacity="0.9"/>
    <circle cx="178" cy="332" r="3.5" fill="#a78bfa" opacity="0.85"/>
    <circle cx="200" cy="355" r="3" fill="#c084fc" opacity="0.8"/>

    <!-- Right hemisphere nodes -->
    <circle cx="325" cy="145" r="4" fill="#c084fc" opacity="0.9"/>
    <circle cx="345" cy="185" r="3.5" fill="#a78bfa" opacity="0.85"/>
    <circle cx="355" cy="225" r="4" fill="#c084fc" opacity="0.9"/>
    <circle cx="352" cy="265" r="3.5" fill="#a78bfa" opacity="0.85"/>
    <circle cx="342" cy="300" r="4" fill="#c084fc" opacity="0.9"/>
    <circle cx="322" cy="332" r="3.5" fill="#a78bfa" opacity="0.85"/>
    <circle cx="300" cy="355" r="3" fill="#c084fc" opacity="0.8"/>

    <!-- Central spine nodes -->
    <circle cx="250" cy="120" r="4.5" fill="#e9d5ff" opacity="0.95"/>
    <circle cx="250" cy="165" r="4" fill="#c084fc" opacity="0.9"/>
    <circle cx="250" cy="210" r="5" fill="#e9d5ff" opacity="0.95"/>
    <circle cx="250" cy="255" r="4" fill="#c084fc" opacity="0.9"/>
    <circle cx="250" cy="300" r="4.5" fill="#e9d5ff" opacity="0.95"/>
    <circle cx="250" cy="340" r="4" fill="#c084fc" opacity="0.9"/>

    <!-- Extra detail nodes -->
    <circle cx="200" cy="165" r="2.5" fill="#818cf8" opacity="0.7"/>
    <circle cx="300" cy="165" r="2.5" fill="#818cf8" opacity="0.7"/>
    <circle cx="190" cy="235" r="2.5" fill="#818cf8" opacity="0.7"/>
    <circle cx="310" cy="235" r="2.5" fill="#818cf8" opacity="0.7"/>
    <circle cx="195" cy="285" r="2.5" fill="#818cf8" opacity="0.7"/>
    <circle cx="305" cy="285" r="2.5" fill="#818cf8" opacity="0.7"/>
    <circle cx="210" cy="195" r="2" fill="#a78bfa" opacity="0.6"/>
    <circle cx="290" cy="195" r="2" fill="#a78bfa" opacity="0.6"/>
    <circle cx="215" cy="315" r="2" fill="#a78bfa" opacity="0.6"/>
    <circle cx="285" cy="315" r="2" fill="#a78bfa" opacity="0.6"/>
  </g>

  <!-- ===== "AI" LABEL ===== -->
  <g filter="url(#textGlow)">
    <circle cx="340" cy="120" r="28" fill="none" stroke="#06d6a0" stroke-width="2" opacity="0.8"/>
    <circle cx="340" cy="120" r="28" fill="#06d6a0" opacity="0.1"/>
    <text x="340" y="128" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800" fill="#06d6a0" opacity="0.95">AI</text>
  </g>

  <!-- ===== ENERGY STREAM from brain to hand ===== -->
  <g filter="url(#softGlow)">
    <!-- Main stream -->
    <path d="M250,370 C250,390 248,410 250,430 C252,450 248,470 250,490"
          fill="none" stroke="#8b5cf6" stroke-width="2" opacity="0.5"/>
    <path d="M240,375 C238,400 242,425 240,450 C238,475 242,495 240,510"
          fill="none" stroke="#a78bfa" stroke-width="1" opacity="0.3"/>
    <path d="M260,375 C262,400 258,425 260,450 C262,475 258,495 260,510"
          fill="none" stroke="#a78bfa" stroke-width="1" opacity="0.3"/>

    <!-- Dripping particles -->
    <circle cx="245" cy="400" r="2" fill="#c084fc" opacity="0.7">
      <animate attributeName="cy" values="380;520" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="255" cy="420" r="1.5" fill="#a78bfa" opacity="0.6">
      <animate attributeName="cy" values="390;530" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="250" cy="440" r="2.5" fill="#e9d5ff" opacity="0.8">
      <animate attributeName="cy" values="400;540" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="248" cy="410" r="1" fill="#818cf8" opacity="0.5">
      <animate attributeName="cy" values="395;535" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="252" cy="430" r="1.5" fill="#c084fc" opacity="0.6">
      <animate attributeName="cy" values="410;550" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0" dur="3.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ===== HAND SILHOUETTE ===== -->
  <g filter="url(#softGlow)" opacity="0.7">
    <path d="M220,540 C215,530 210,520 208,510 C206,500 210,495 215,498 C218,500 220,505 222,510
             L225,490 C225,482 228,478 232,480 C236,482 237,488 236,495
             L238,475 C238,467 242,463 246,465 C250,467 251,475 250,483
             L252,475 C252,467 256,463 260,465 C264,467 265,475 264,483
             L266,485 C268,478 272,476 275,480 C278,484 278,492 276,500
             L280,510 C282,520 278,530 270,540
             C260,555 240,558 230,550 C225,546 222,543 220,540Z"
          fill="none" stroke="#c084fc" stroke-width="1.8" opacity="0.6"/>
    <path d="M220,540 C215,530 210,520 208,510 C206,500 210,495 215,498 C218,500 220,505 222,510
             L225,490 C225,482 228,478 232,480 C236,482 237,488 236,495
             L238,475 C238,467 242,463 246,465 C250,467 251,475 250,483
             L252,475 C252,467 256,463 260,465 C264,467 265,475 264,483
             L266,485 C268,478 272,476 275,480 C278,484 278,492 276,500
             L280,510 C282,520 278,530 270,540
             C260,555 240,558 230,550 C225,546 222,543 220,540Z"
          fill="#a855f7" opacity="0.08"/>
    <!-- Palm glow -->
    <ellipse cx="250" cy="515" rx="25" ry="15" fill="#c084fc" opacity="0.15" filter="url(#auraGlow)"/>
  </g>

  <!-- ===== FLOATING SPARKLES ===== -->
  <g filter="url(#particleGlow)">
    <circle cx="120" cy="130" r="2" fill="#e9d5ff" opacity="0.6">
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="380" cy="100" r="1.5" fill="#c084fc" opacity="0.5">
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="100" cy="280" r="2" fill="#a78bfa" opacity="0.4">
      <animate attributeName="opacity" values="0.1;0.7;0.1" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="400" cy="300" r="1.5" fill="#e9d5ff" opacity="0.5">
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="130" cy="350" r="1" fill="#818cf8" opacity="0.4">
      <animate attributeName="opacity" values="0.1;0.6;0.1" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="370" cy="380" r="2" fill="#c084fc" opacity="0.5">
      <animate attributeName="opacity" values="0.2;0.7;0.2" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="160" cy="80" r="1.5" fill="#06d6a0" opacity="0.3">
      <animate attributeName="opacity" values="0.1;0.5;0.1" dur="4.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="340" cy="400" r="1" fill="#06d6a0" opacity="0.3">
      <animate attributeName="opacity" values="0.1;0.5;0.1" dur="3.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="420" cy="180" r="2.5" fill="#e9d5ff" opacity="0.4">
      <animate attributeName="opacity" values="0.15;0.65;0.15" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="80" cy="200" r="1.5" fill="#a855f7" opacity="0.3">
      <animate attributeName="opacity" values="0.1;0.5;0.1" dur="3s" repeatCount="indefinite"/>
    </circle>
    <!-- Small star crosses -->
    <g transform="translate(390,150)" opacity="0.5">
      <line x1="-4" y1="0" x2="4" y2="0" stroke="#e9d5ff" stroke-width="1"/>
      <line x1="0" y1="-4" x2="0" y2="4" stroke="#e9d5ff" stroke-width="1"/>
      <animate attributeName="opacity" values="0.2;0.7;0.2" dur="2s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(110,310)" opacity="0.4">
      <line x1="-3" y1="0" x2="3" y2="0" stroke="#c084fc" stroke-width="1"/>
      <line x1="0" y1="-3" x2="0" y2="3" stroke="#c084fc" stroke-width="1"/>
      <animate attributeName="opacity" values="0.15;0.6;0.15" dur="2.5s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(430,260)" opacity="0.35">
      <line x1="-3" y1="0" x2="3" y2="0" stroke="#a78bfa" stroke-width="1"/>
      <line x1="0" y1="-3" x2="0" y2="3" stroke="#a78bfa" stroke-width="1"/>
      <animate attributeName="opacity" values="0.1;0.55;0.1" dur="3s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- ===== PULSING ENERGY RINGS ===== -->
  <circle cx="250" cy="230" r="100" fill="none" stroke="#8b5cf6" stroke-width="0.5" opacity="0.15">
    <animate attributeName="r" values="100;160;100" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.15;0.02;0.15" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="250" cy="230" r="130" fill="none" stroke="#a78bfa" stroke-width="0.5" opacity="0.1">
    <animate attributeName="r" values="130;190;130" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.1;0.01;0.1" dur="8s" repeatCount="indefinite"/>
  </circle>
</svg>