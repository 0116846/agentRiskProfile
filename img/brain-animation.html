<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; }
body { background: transparent; overflow: hidden; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = canvas.width = 600;
const H = canvas.height = 500;

const particles = [];
const neuronNodes = [];
const neuronEdges = [];
const rainDrops = [];
const glowParticles = [];

// Brain shape defined as ellipse regions
const brainCenterX = W / 2;
const brainCenterY = H / 2 - 20;
const brainRadiusX = 160;
const brainRadiusY = 130;

function isInsideBrain(x, y) {
    // Main brain shape (two hemispheres with a slight gap)
    const dx = x - brainCenterX;
    const dy = y - brainCenterY;
    const leftHemi = Math.pow((dx + 10) / brainRadiusX, 2) + Math.pow(dy / brainRadiusY, 2);
    const rightHemi = Math.pow((dx - 10) / brainRadiusX, 2) + Math.pow(dy / brainRadiusY, 2);
    // Brain stem
    const stemCheck = Math.abs(dx) < 30 && dy > brainRadiusY * 0.6 && dy < brainRadiusY * 1.2;
    return leftHemi < 1 || rightHemi < 1 || stemCheck;
}

// Generate neuron nodes inside brain shape
for (let i = 0; i < 180; i++) {
    let x, y, attempts = 0;
    do {
        x = brainCenterX + (Math.random() - 0.5) * brainRadiusX * 2.2;
        y = brainCenterY + (Math.random() - 0.5) * brainRadiusY * 2.2;
        attempts++;
    } while (!isInsideBrain(x, y) && attempts < 100);
    if (attempts < 100) {
        neuronNodes.push({
            x, y,
            radius: Math.random() * 2 + 1,
            pulse: Math.random() * Math.PI * 2,
            pulseSpeed: 0.02 + Math.random() * 0.03,
            color: Math.random() > 0.5 ? 'cyan' : (Math.random() > 0.5 ? 'magenta' : 'white'),
            brightness: 0.3 + Math.random() * 0.7
        });
    }
}

// Connect nearby neurons
for (let i = 0; i < neuronNodes.length; i++) {
    for (let j = i + 1; j < neuronNodes.length; j++) {
        const dx = neuronNodes[i].x - neuronNodes[j].x;
        const dy = neuronNodes[i].y - neuronNodes[j].y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < 60 && Math.random() > 0.5) {
            neuronEdges.push({ a: i, b: j, dist, signal: Math.random(), signalSpeed: 0.005 + Math.random() * 0.01 });
        }
    }
}

// Rain / falling light particles
for (let i = 0; i < 120; i++) {
    rainDrops.push({
        x: Math.random() * W,
        y: Math.random() * H,
        speed: 0.5 + Math.random() * 2,
        length: 5 + Math.random() * 20,
        opacity: 0.1 + Math.random() * 0.4,
        color: Math.random() > 0.6 ? '#8b5cf6' : (Math.random() > 0.5 ? '#06b6d4' : '#a78bfa')
    });
}

// Floating glow particles
for (let i = 0; i < 60; i++) {
    glowParticles.push({
        x: Math.random() * W,
        y: Math.random() * H,
        vx: (Math.random() - 0.5) * 0.3,
        vy: (Math.random() - 0.5) * 0.3,
        radius: 1 + Math.random() * 3,
        opacity: 0.2 + Math.random() * 0.5,
        color: ['#8b5cf6', '#06b6d4', '#ec4899', '#a78bfa', '#67e8f9'][Math.floor(Math.random() * 5)],
        pulse: Math.random() * Math.PI * 2
    });
}

// "AI" text properties
const aiTextX = brainCenterX;
const aiTextY = brainCenterY + 5;

let time = 0;

function drawBackground() {
    const grad = ctx.createRadialGradient(W / 2, H / 2, 50, W / 2, H / 2, W * 0.7);
    grad.addColorStop(0, '#1a1145');
    grad.addColorStop(0.4, '#0f0a2e');
    grad.addColorStop(0.7, '#0a0620');
    grad.addColorStop(1, '#050312');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    // Subtle star field
    for (let i = 0; i < 80; i++) {
        const sx = (i * 7.31 * W) % W;
        const sy = (i * 13.37 * H) % H;
        const twinkle = 0.3 + 0.7 * Math.sin(time * 0.5 + i);
        ctx.fillStyle = `rgba(255,255,255,${0.1 * twinkle})`;
        ctx.fillRect(sx, sy, 1, 1);
    }
}

function drawBrainGlow() {
    // Outer glow
    const grad = ctx.createRadialGradient(brainCenterX, brainCenterY, 60, brainCenterX, brainCenterY, 220);
    grad.addColorStop(0, 'rgba(139,92,246,0.15)');
    grad.addColorStop(0.3, 'rgba(6,182,212,0.08)');
    grad.addColorStop(0.6, 'rgba(236,72,153,0.04)');
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    // Inner brain glow pulse
    const pulse = 0.8 + 0.2 * Math.sin(time * 0.8);
    const innerGrad = ctx.createRadialGradient(brainCenterX, brainCenterY, 20, brainCenterX, brainCenterY, 150);
    innerGrad.addColorStop(0, `rgba(139,92,246,${0.12 * pulse})`);
    innerGrad.addColorStop(0.5, `rgba(6,182,212,${0.06 * pulse})`);
    innerGrad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = innerGrad;
    ctx.fillRect(0, 0, W, H);
}

function drawBrainOutline() {
    ctx.save();
    ctx.beginPath();
    // Left hemisphere
    ctx.ellipse(brainCenterX - 10, brainCenterY, brainRadiusX * 0.95, brainRadiusY * 0.95, 0, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(139,92,246,${0.15 + 0.05 * Math.sin(time)})`;
    ctx.lineWidth = 1;
    ctx.stroke();

    // Brain folds (sulci) - wavy lines
    for (let i = 0; i < 8; i++) {
        ctx.beginPath();
        const startAngle = (i / 8) * Math.PI * 2;
        const cx = brainCenterX + Math.cos(startAngle) * 30;
        const cy = brainCenterY + Math.sin(startAngle) * 20;
        for (let t = 0; t < 1; t += 0.02) {
            const angle = startAngle + t * 1.5;
            const r = 40 + t * 80 + Math.sin(t * 10 + time * 0.5) * 8;
            const px = cx + Math.cos(angle) * r * 0.8;
            const py = cy + Math.sin(angle) * r * 0.7;
            if (isInsideBrain(px, py)) {
                if (t === 0) ctx.moveTo(px, py);
                else ctx.lineTo(px, py);
            }
        }
        ctx.strokeStyle = `rgba(139,92,246,${0.06 + 0.02 * Math.sin(time + i)})`;
        ctx.lineWidth = 0.5;
        ctx.stroke();
    }
    ctx.restore();
}

function drawNeuralNetwork() {
    // Draw edges with traveling signals
    neuronEdges.forEach(edge => {
        const a = neuronNodes[edge.a];
        const b = neuronNodes[edge.b];
        edge.signal = (edge.signal + edge.signalSpeed) % 1;

        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        ctx.strokeStyle = `rgba(139,92,246,${0.08 + 0.04 * Math.sin(time + edge.a)})`;
        ctx.lineWidth = 0.5;
        ctx.stroke();

        // Traveling signal dot
        const sx = a.x + (b.x - a.x) * edge.signal;
        const sy = a.y + (b.y - a.y) * edge.signal;
        const signalGrad = ctx.createRadialGradient(sx, sy, 0, sx, sy, 4);
        signalGrad.addColorStop(0, 'rgba(103,232,249,0.8)');
        signalGrad.addColorStop(1, 'rgba(103,232,249,0)');
        ctx.fillStyle = signalGrad;
        ctx.fillRect(sx - 4, sy - 4, 8, 8);
    });

    // Draw nodes
    neuronNodes.forEach(node => {
        node.pulse += node.pulseSpeed;
        const p = 0.5 + 0.5 * Math.sin(node.pulse);
        const r = node.radius * (0.8 + 0.4 * p);
        const alpha = node.brightness * (0.4 + 0.6 * p);

        const grad = ctx.createRadialGradient(node.x, node.y, 0, node.x, node.y, r * 3);
        if (node.color === 'cyan') {
            grad.addColorStop(0, `rgba(103,232,249,${alpha})`);
            grad.addColorStop(0.5, `rgba(6,182,212,${alpha * 0.3})`);
        } else if (node.color === 'magenta') {
            grad.addColorStop(0, `rgba(236,72,153,${alpha})`);
            grad.addColorStop(0.5, `rgba(192,38,211,${alpha * 0.3})`);
        } else {
            grad.addColorStop(0, `rgba(255,255,255,${alpha})`);
            grad.addColorStop(0.5, `rgba(167,139,250,${alpha * 0.3})`);
        }
        grad.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(node.x, node.y, r * 3, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = `rgba(255,255,255,${alpha})`;
        ctx.beginPath();
        ctx.arc(node.x, node.y, r * 0.5, 0, Math.PI * 2);
        ctx.fill();
    });
}

function drawRain() {
    rainDrops.forEach(drop => {
        drop.y += drop.speed;
        if (drop.y > H + drop.length) {
            drop.y = -drop.length;
            drop.x = Math.random() * W;
        }

        const grad = ctx.createLinearGradient(drop.x, drop.y - drop.length, drop.x, drop.y);
        grad.addColorStop(0, `rgba(0,0,0,0)`);
        grad.addColorStop(1, drop.color.replace(')', `,${drop.opacity})`).replace('rgb', 'rgba').replace('#', ''));

        ctx.beginPath();
        ctx.moveTo(drop.x, drop.y - drop.length);
        ctx.lineTo(drop.x, drop.y);

        // Convert hex to rgba for stroke
        const hex = drop.color;
        const r = parseInt(hex.slice(1, 3), 16);
        const g = parseInt(hex.slice(3, 5), 16);
        const b = parseInt(hex.slice(5, 7), 16);
        const lineGrad = ctx.createLinearGradient(drop.x, drop.y - drop.length, drop.x, drop.y);
        lineGrad.addColorStop(0, `rgba(${r},${g},${b},0)`);
        lineGrad.addColorStop(1, `rgba(${r},${g},${b},${drop.opacity})`);

        ctx.strokeStyle = lineGrad;
        ctx.lineWidth = 1;
        ctx.stroke();
    });
}

function drawGlowParticles() {
    glowParticles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.pulse += 0.02;

        if (p.x < 0) p.x = W;
        if (p.x > W) p.x = 0;
        if (p.y < 0) p.y = H;
        if (p.y > H) p.y = 0;

        const alpha = p.opacity * (0.5 + 0.5 * Math.sin(p.pulse));
        const hex = p.color;
        const r = parseInt(hex.slice(1, 3), 16);
        const g = parseInt(hex.slice(3, 5), 16);
        const b = parseInt(hex.slice(5, 7), 16);

        const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.radius * 4);
        grad.addColorStop(0, `rgba(${r},${g},${b},${alpha})`);
        grad.addColorStop(1, `rgba(${r},${g},${b},0)`);
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius * 4, 0, Math.PI * 2);
        ctx.fill();
    });
}

function drawAIText() {
    const pulse = 0.7 + 0.3 * Math.sin(time * 1.2);

    // Text glow
    ctx.save();
    ctx.font = 'bold 56px Arial, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    // Outer glow
    ctx.shadowColor = `rgba(139,92,246,${0.8 * pulse})`;
    ctx.shadowBlur = 30;
    ctx.fillStyle = `rgba(255,255,255,${0.9 * pulse})`;
    ctx.fillText('AI', aiTextX, aiTextY);

    // Second pass for stronger glow
    ctx.shadowColor = `rgba(6,182,212,${0.5 * pulse})`;
    ctx.shadowBlur = 50;
    ctx.fillText('AI', aiTextX, aiTextY);

    ctx.shadowBlur = 0;
    ctx.restore();
}

function animate() {
    time += 0.016;
    drawBackground();
    drawRain();
    drawBrainGlow();
    drawBrainOutline();
    drawNeuralNetwork();
    drawGlowParticles();
    drawAIText();
    requestAnimationFrame(animate);
}

animate();
</script>
</body>
</html>
